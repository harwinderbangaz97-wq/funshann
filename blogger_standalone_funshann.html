  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100dvh; background:#f4f7fb; font-family:sans-serif; touch-action:manipulation; overscroll-behavior:none; }
    ::-webkit-scrollbar { display:none; }
    .nav-bar, .header, .footer, .blog-pager, .post-feeds, .widget, .sidebar { display:none !important; }
  </style>
</head>
<body class="bg-[#f4f7fb] text-[#0f172a] overflow-x-hidden">
  <div id="root"></div>
  <div id="recaptcha-container"></div>
  <script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const firebaseConfig = { apiKey: "AIzaSyCMiX4Gx8vqrFFqfl3XBsLfMZI5hCpySDg", authDomain: "gen-lang-client-0528558677.firebaseapp.com", projectId: "gen-lang-client-0528558677", storageBucket: "gen-lang-client-0528558677.firebasestorage.app", messagingSenderId: "585330478854", appId: "1:585330478854:web:7d80fe760d21cfcc8e9887" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const App = () => {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      return auth.onAuthStateChanged((u) => {
        console.log("onAuthStateChanged called, user:", u);
        setUser(u);
        setLoading(false);
      });
    }, []);

    if (loading) return <div className="h-screen flex items-center justify-center">Loading...</div>;
    // Check email verification for email-based users
    if (user && user.email && !user.emailVerified) return <div className="h-screen flex flex-col items-center justify-center p-6 gap-4">Please verify your email address to continue. <button onClick={() => auth.signOut()} className="p-2 bg-slate-100 rounded-xl">Logout</button></div>;
    return user ? <MainApp user={user} /> : <AuthScreen />;
  };

  const AuthScreen = () => {
    const [isSignup, setIsSignup] = useState(false);
    const [authMethod, setAuthMethod] = useState('email'); // 'email' or 'phone'
    const [name, setName] = useState('');
    const [phone, setPhone] = useState('');
    const [otp, setOtp] = useState('');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);
    const [confirmResult, setConfirmResult] = useState(null);
    const recaptchaVerifierRef = useRef(null);

    useEffect(() => {
        if (!recaptchaVerifierRef.current) {
          recaptchaVerifierRef.current = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            size: 'invisible'
          });
        }
        return () => {
          if (recaptchaVerifierRef.current) {
            recaptchaVerifierRef.current.clear();
            recaptchaVerifierRef.current = null;
          }
        };
    }, []);

    const sendOTP = async () => {
      setLoading(true);
      setError(null);
      try {
        if (!recaptchaVerifierRef.current) throw new Error("reCAPTCHA not initialized");
        const result = await auth.signInWithPhoneNumber(firebase.auth.PhoneAuthProvider.PROVIDER_ID, phone, recaptchaVerifierRef.current);
        setConfirmResult(result);
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    };

    const verifyOTP = async () => {
      setLoading(true);
      setError(null);
      try {
        if (!confirmResult) throw new Error("Please send OTP first");
        
        const userCredential = await confirmResult.confirm(otp);
        
        if (isSignup && name) {
          await userCredential.user.updateProfile({ displayName: name });
        }
      } catch (e) {
        setError(e.message);
        setLoading(false);
      }
    };

    const emailLogin = async () => {
      setLoading(true);
      setError(null);
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    };
    
    const emailSignup = async () => {
      setLoading(true);
      setError(null);
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await userCredential.user.updateProfile({ displayName: name });
        await userCredential.user.sendEmailVerification();
        alert("Verification email sent!");
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    };

    return (
      <div className="h-screen flex flex-col items-center justify-center p-6 gap-4 overflow-y-auto">
        <h2 className="text-2xl font-bold">{isSignup ? 'Sign Up' : 'Sign In'}</h2>
        {error && <div className="text-red-500 text-sm">{error}</div>}
        <button onClick={googleLogin} className="w-full p-4 bg-white border rounded-2xl" disabled={loading}>Sign in with Google</button>
        
        <div className="flex gap-2 w-full">
            <button onClick={() => setAuthMethod('email')} className={`flex-1 p-2 rounded-xl ${authMethod === 'email' ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>Email</button>
            <button onClick={() => setAuthMethod('phone')} className={`flex-1 p-2 rounded-xl ${authMethod === 'phone' ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>Phone</button>
        </div>

        {authMethod === 'email' && <>
          {isSignup && <input className="w-full p-4 border rounded-2xl" placeholder="Full Name" onChange={e => setName(e.target.value)} disabled={loading} />}
          <input className="w-full p-4 border rounded-2xl" placeholder="Email" onChange={e => setEmail(e.target.value)} disabled={loading} />
          <input className="w-full p-4 border rounded-2xl" type="password" placeholder="Password" onChange={e => setPassword(e.target.value)} disabled={loading} />
          <div className="flex gap-2 w-full">
            <button onClick={isSignup ? emailSignup : emailLogin} className="w-full p-4 bg-slate-800 text-white rounded-2xl" disabled={loading}>{isSignup ? 'Signup' : 'Login'}</button>
          </div>
        </>}

        {authMethod === 'phone' && <>
          {isSignup && <input className="w-full p-4 border rounded-2xl" placeholder="Full Name" onChange={e => setName(e.target.value)} disabled={loading} />}
          <input className="w-full p-4 border rounded-2xl" placeholder="Phone (+1...)" onChange={e => setPhone(e.target.value)} disabled={loading} />
          {!confirmResult && <button onClick={sendOTP} className="w-full p-4 bg-slate-800 text-white rounded-2xl" disabled={loading || !phone}>Send SMS OTP</button>}
          {confirmResult && <>
            <input className="w-full p-4 border rounded-2xl" placeholder="OTP" onChange={e => setOtp(e.target.value)} disabled={loading} />
            <button onClick={verifyOTP} className="w-full p-4 bg-blue-600 text-white rounded-2xl" disabled={loading || !otp}>Verify OTP & Login</button>
          </>}
        </>}

        <button onClick={() => setIsSignup(!isSignup)} className="text-blue-600 text-sm">
          {isSignup ? 'Already have an account? Login' : 'Need an account? Signup'}
        </button>
      </div>
    );
  };

  const MainApp = ({user}) => {
    const [activeTab, setActiveTab] = useState('home');
    return (
      <div className="h-full min-h-screen bg-[#f4f7fb] pb-24">
        {activeTab === 'home' && (
          <div className="p-5 max-w-md mx-auto">
            <h2 className="text-xl font-bold text-slate-800 mb-2">Welcome to Funshann</h2>
            <p className="text-sm text-slate-600 mb-4">{user.displayName || user.phoneNumber || 'Member'}</p>
          </div>
        )}
        {activeTab === 'profile' && (
          <div className="p-5 max-w-md mx-auto">
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center text-center">
              <div className="w-24 h-24 rounded-full bg-blue-50 flex items-center justify-center text-3xl font-bold text-[#5B9DFF] mb-4 border border-blue-100 shadow-inner">
                {(user.displayName || user.phoneNumber || 'F')[0].toUpperCase()}
              </div>
              <h3 className="text-lg font-bold text-slate-800">{user.displayName || 'Funshann Member'}</h3>
              <p className="text-xs text-slate-500 mb-4">{user.phoneNumber || user.email || '@user'}</p>
              <button onClick={() => auth.signOut()} className="px-5 py-2.5 bg-red-50 text-red-600 rounded-full font-bold text-xs hover:bg-red-100 transition cursor-pointer">Logout</button>
            </div>
          </div>
        )}
        {activeTab === 'search' && (
          <div className="p-5 max-w-md mx-auto text-center text-slate-500 text-sm">Explore and discover people on Funshann.</div>
        )}
        {activeTab === 'plus' && (
          <div className="p-5 max-w-md mx-auto text-center text-slate-500 text-sm">Create a new post or story.</div>
        )}
        {activeTab === 'messages' && (
          <div className="p-5 max-w-md mx-auto text-center text-slate-500 text-sm">Your private chats and messages.</div>
        )}
        <nav className="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-4 right-4 bg-white/90 backdrop-blur border rounded-full p-2 flex justify-between shadow-xl z-50">
          {['home','search','plus','messages','profile'].map(t => (
            <button key={t} onClick={() => setActiveTab(t)} className={`p-3 font-bold capitalize text-xs rounded-full transition ${activeTab === t ? 'text-[#5B9DFF] bg-blue-50' : 'text-slate-500'}`}>{t}</button>
          ))}
        </nav>
      </div>
    );
  };

  ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

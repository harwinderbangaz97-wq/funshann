<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Funshann – Connect, Share &amp; Discover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="description" content="Funshann is a social platform to connect with people, share posts, discover content and chat with your community." />
    <link rel="canonical" href="https://funshann.blogspot.com/" />

    <!-- Favicon / Brand Logo -->
    <link rel="icon" type="image/x-icon" href="https://funshann.blogspot.com/favicon.ico" />
    <link rel="shortcut icon" href="https://funshann.blogspot.com/favicon.ico" />
    <link rel="apple-touch-icon" href="https://harwinderbangaz97-wq.github.io/funshann/logo.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funshann.blogspot.com/" />
    <meta property="og:title" content="Funshann – Connect, Share &amp; Discover" />
    <meta property="og:description" content="Funshann is a social platform to connect with people, share posts, discover content and chat with your community." />
    <meta property="og:image" content="https://harwinderbangaz97-wq.github.io/funshann/logo.png" />
    <meta property="og:image:secure_url" content="https://harwinderbangaz97-wq.github.io/funshann/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Funshann – Connect, Share &amp; Discover" />
    <meta property="og:site_name" content="Funshann" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://funshann.blogspot.com/" />
    <meta name="twitter:title" content="Funshann – Connect, Share &amp; Discover" />
    <meta name="twitter:description" content="Funshann is a social platform to connect with people, share posts, discover content and chat with your community." />
    <meta name="twitter:image" content="https://harwinderbangaz97-wq.github.io/funshann/logo.png" />
    <meta name="twitter:image:alt" content="Funshann – Connect, Share &amp; Discover" />

    <meta name="theme-color" content="#0F172A" />
  </head>
  <body class="bg-[#f4f7fb] text-[#1e293b] antialiased selection:bg-[#5B9DFF]/20 selection:text-[#1d4ed8] overflow-x-hidden">
    <div id="root">
      <!-- High-performance fallback for blank screen issues in external browsers -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; text-align: center;">
        <div style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #5B9DFF; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="margin: 0 0 10px 0; color: #334155;">Initializing Funshann...</h2>
        <p style="margin: 0; color: #64748b; font-size: 14px;">If this screen persists, please check your internet connection or try refreshing.</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <!-- Permanent DOM container for Firebase Phone Auth invisible reCAPTCHA -->
    <div id="recaptcha-container"></div>

    <!-- REDIRECT_ROOT_TO_DOCS_START -->
    <script>
      // If served directly on static hosting (like GitHub Pages serving repo root),
      // forward to the built production application in docs/ immediately before TSX parse failure
      (function() {
        var host = window.location.hostname;
        var port = window.location.port;
        var isLocalOrDev = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.run.app') !== -1 || (port && port !== '80' && port !== '443');
        if (!isLocalOrDev) {
          var p = window.location.pathname;
          var dir = p.substring(0, p.lastIndexOf('/') + 1);
          if (!p.includes('/docs') && !p.includes('/dist') && !p.includes('standalone')) {
            window.location.replace(dir + 'docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
    <!-- REDIRECT_ROOT_TO_DOCS_END -->

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback for primary script load errors
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && (e.target.src.includes('main.tsx') || e.target.src.includes('/assets/'))) {
          console.error('Script load error detected:', e.target.src);
          const root = document.getElementById('root');

          // Attempt auto-recovery if static server served raw root index.html instead of built dist
          var currentPath = window.location.pathname;
          var currentDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
          var hash = window.location.hash || '';

          if (!currentPath.includes('/docs') && !currentPath.includes('/dist') && !currentPath.includes('standalone.html')) {
            fetch(currentDir + 'docs/index.html', { method: 'HEAD' })
              .then(function(res) {
                if (res && res.ok) {
                  window.location.replace(currentDir + 'docs/' + hash);
                  return true;
                }
                return fetch(currentDir + 'dist/index.html', { method: 'HEAD' });
              })
              .then(function(res) {
                if (res && res.ok) {
                  window.location.replace(currentDir + 'dist/' + hash);
                  return true;
                }
                return fetch(currentDir + 'standalone.html', { method: 'HEAD' });
              })
              .then(function(res) {
                if (res && res.ok) {
                  window.location.replace(currentDir + 'standalone.html' + hash);
                }
              })
              .catch(function() {});
          }

          if (root && root.innerHTML.includes('Initializing')) {
            root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; text-align: center;"><h2 style="color: #ef4444; margin-bottom: 8px;">Failed to load application</h2><p style="color: #64748b; max-width: 320px; line-height: 1.5; font-size: 14px;">The application script could not be loaded. Please try refreshing or launch the standalone version.</p><div style="display: flex; gap: 10px; margin-top: 20px;"><button onclick="window.location.reload()" style="padding: 10px 20px; background: #5B9DFF; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">Try Again</button><a href="' + currentDir + 'standalone.html" style="padding: 10px 20px; background: #334155; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center;">Open Standalone</a></div></div>';
          }
        }
      }, true);
    </script>
  </body>
</html>
